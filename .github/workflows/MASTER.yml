name: Update Master FNO Pipeline

on:
  schedule:
    # Roz market band hone ke baad ya subah update ke liye (Mon-Fri)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-master-fno:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance gspread google-auth pyyaml

      - name: Run Master FNO Script
        run: |
          python update_master_fno.py
