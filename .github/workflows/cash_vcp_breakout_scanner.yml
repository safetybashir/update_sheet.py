name: Run Live Cash Sync

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5' # Mon-Fri IST market hours (9:15 AM - 3:30 PM)
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance gspread google-auth pytz

      # 🔑 DYNAMIC CREDENTIALS CREATION (MATCHING YOUR SECRET NAME)
      - name: Create credentials.json from GitHub Secret
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_JSON }}" > credentials.json

      - name: Execute Cash Sync Script
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python update_sheet.py
