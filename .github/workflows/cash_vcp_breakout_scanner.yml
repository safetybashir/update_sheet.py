name: 🎯 Cash Multi-Month VCP Breakout Scanner

on:
  schedule:
    # Monday to Friday ko 09:45 UTC par (3:15 PM IST - Market Closing Scan)
    - cron: '45 9 * * 1-5'
  workflow_dispatch: # Actions tab se manual Trigger karne ke liye

jobs:
  run-cash-vcp-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cash Scanner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy gspread gspread-formatting pytz

      - name: Execute Cash VCP Breakout Engine
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          python update_sheet.py
