name: 5 EMA Reversal Scanner Update

on:
  schedule:
    # यह समय 14:45 UTC है, जिसका मतलब भारत में रात 8:15 PM है (Mon-Fri)
    - cron: '45 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-ema-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml yfinance gspread google-auth oauth2client pytz

      - name: Run 5 EMA Scanner Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          python ema_reversal_scanner.py
