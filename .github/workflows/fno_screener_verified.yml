name: Run Advanced FNO Master Screener Fixed

on:
  schedule:
    - cron: '*/15 3-9 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🟢 FORCE INSTALL BLOCK: Yeh step har haal mein yfinance aur pytz install karega hi karega
      - name: Install Required Python Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread oauth2client requests openpyxl yfinance pytz

      - name: Run Master FNO Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python update_master_fno.py
