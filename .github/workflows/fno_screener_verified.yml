name: 📊 Master FNO Screener Update

on:
  schedule:
    - cron: '*/5 3-10 * * 1-5'  # Har 5 minute mein (Market hours: Mon-Fri)
  workflow_dispatch:           # Manual trigger button

jobs:
  update-master-fno:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas numpy pytz

      - name: Run Master FNO Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: python update_master_fno.py
