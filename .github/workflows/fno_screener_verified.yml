name: Live Master F&O Screener Automation

on:
  schedule:
    # Runs every 15 mins during market hours (9:15 AM - 3:30 PM IST) Monday to Friday
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:  # GitHub UI se manually run karne ke liye

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread google-auth pytz

      - name: Execute Update Master FNO Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: python update_master_fno.py --once
