name: Master FNO Real Market Auto Screener

on:
  schedule:
    # Automatic run every 15 minutes during Indian market hours (Mon-Fri, 3:45 AM - 10:15 AM UTC)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy gspread google-auth pytz yfinance

      - name: Execute Live Screener Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          python update_master_fno.py --once
