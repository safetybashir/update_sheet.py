name: Sensibule High Conviction Scanner Automation

on:
  schedule:
    # Run every 5 minutes during Indian Market Hours (9:15 AM - 3:30 PM IST / 3:45 AM - 10:00 AM UTC)
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-sensibule-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install All Required Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance gspread google-auth pytz numpy

    - name: Run Sensibule Continuation Scanner
      env:
        GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      run: python high_conviction_scanner.py
