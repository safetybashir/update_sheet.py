name: High Conviction FNO Scanner Pipeline

on:
  schedule:
    # Runs every 5 minutes Monday to Friday between 03:30 UTC and 10:00 UTC (9:00 AM to 3:30 PM IST)
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas gspread google-auth pytz

      - name: Execute High Conviction Scanner
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
        run: |
          python high_conviction_scanner.py
