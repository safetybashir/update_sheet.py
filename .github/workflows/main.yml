name: Fast Swing Scanner Automation

on:
  schedule:
    # 5 मिनट के बजाय हर 15 मिनट पर चलाएं (GitHub Rate Limit से बचने के लिए)
    - cron: '*/15 * * * *'
  workflow_dispatch: # मैन्युअल रन करने का बटन

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # पैकेज डाउनलोड में तेज़ी के लिए कैशे

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance gspread google-auth pytz

      - name: Execute Scanner Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python update_sheet.py
