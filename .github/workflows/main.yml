name: AI-Bro-Scanner-10min

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# --- Purana run cancel ho jayega agar naya run aaye ---
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          pip install yfinance gspread google-auth pandas numpy pytz requests
      
      - name: Run scanner
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python update_sheet.py
