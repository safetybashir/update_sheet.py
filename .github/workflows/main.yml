name: Cleanup Old Workflow Runs

on:
  schedule:
    - cron: '0 0 * * *'  # Har raat 12:00 AM (IST) ko chalega
  workflow_dispatch:       # Manual trigger bhi rakh sakte hain

jobs:
  delete-old-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete old workflow runs
        uses: yanovation/delete-old-actions@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          days-ago: 30         # 30 din se purani runs delete karo
          keep-latest: 10      # Hamesha last 10 runs ko rakhna
