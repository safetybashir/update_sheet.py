name: Run Stock Screener

on:
  schedule:
    # Har 15 minute me auto run hoga (Market hours)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual "Run workflow" button ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas yfinance gspread google-auth pytz

      - name: Run Screener Script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        # FIX: Yahan 'main.py' ke bajaye aapki asli file 'update_sheet.py' set kar di gayi hai
        run: python update_sheet.py
