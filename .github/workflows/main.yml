name: Cleanup Old Runs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old runs using GitHub CLI
        run: |
          gh run list --limit 100 --json databaseId,createdAt \
            --jq '.[] | select(.createdAt < "'$(date -d '30 days ago' -Iseconds)'") | .databaseId' \
            | xargs -I {} gh run delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
