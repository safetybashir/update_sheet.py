name: Cleanup Old Runs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        run: |
          # Install GitHub CLI
          gh --version || (sudo apt update && sudo apt install gh)
          
          # Delete runs older than 30 days, keep latest 10
          gh run list --limit 100 --json databaseId,createdAt \
            --jq '.[] | select(.createdAt < "'$(date -d '30 days ago' -Iseconds)'") | .databaseId' \
            | xargs -I {} gh run delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
