name: Live FnO Screener Auto-Run

on:
  schedule:
    # Har 15 minute me ek baar chalega (Market hours)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Manual Run button ke liye

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas yfinance gspread google-auth pytz

      - name: Run Screener (Single Pass)
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python main.py
