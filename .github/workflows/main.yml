name: OI_VCP Dashboard Auto Update

on:
  schedule:
    # Har 15 minute mein automatically run hoga (Monday to Friday)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Manual Run button ke liye

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas gspread google-auth pytz

    - name: Run Python Script
      env:
        SHEET_ID: ${{ secrets.SHEET_ID }}
        GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      run: python update_sheet.py
