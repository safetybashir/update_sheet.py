name: Monthly Cleanup

on:
  schedule:
    - cron: '0 0 1 * *'   # Har mahine 1 tarikh ko
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all but latest 10 runs
        run: |
          gh run list --limit 100 --json databaseId --jq '.[].databaseId' | tail -n +11 | xargs -I {} gh run delete {}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
