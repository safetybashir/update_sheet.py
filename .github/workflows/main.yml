name: Cleanup Old Runs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old runs (keep latest 10)
        run: |
          # Get all run IDs except latest 10
          RUN_IDS=$(gh run list --limit 100 --json databaseId --jq '.[].databaseId' | tail -n +11)
          
          if [ -n "$RUN_IDS" ]; then
            echo "$RUN_IDS" | xargs -I {} gh run delete {}
            echo "✅ Deleted old runs"
          else
            echo "ℹ️ No old runs to delete (less than 10 runs total)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
