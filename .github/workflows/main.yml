name: OI_VCP Dashboard Auto Update

on:
  schedule:
    # Monday to Friday: Every 15 minutes during IST market hours (03:45 UTC to 10:00 UTC)
    - cron: '*/15 3-9 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, installing core packages..."
            pip install pandas requests gspread oauth2client kiteconnect
          fi

      - name: Execute Live Update Script
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
        run: python update_sheet.py
