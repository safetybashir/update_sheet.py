name: Update Google Sheet Daily

on:
  schedule:
    # Example: Runs every 15 minutes during Indian market hours (Mon-Fri)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch: # Allows manual run button in GitHub

jobs:
  update-sheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas yfinance gspread google-auth pytz

      - name: Run Market Scanner & Update Sheet
        env:
          # CRITICAL: Secrets must be passed explicitly to environment variables here
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python update_sheet.py
