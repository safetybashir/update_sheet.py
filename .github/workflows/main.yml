name: AI-Bro-Scanner-10min

on:
  schedule:
    # Runs every 10 minutes between 03:30 UTC and 10:10 UTC, Monday to Friday
    # Equivalent to 09:00 AM IST to 03:40 PM IST (NSE Live Market Hours)
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch:

# Cancel previous running instances if a new trigger arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir yfinance gspread google-auth pandas numpy pytz requests

      - name: Check Market Hours (IST Sanity Check)
        run: |
          python -c "
          import pytz
          from datetime import datetime
          ist = pytz.timezone('Asia/Kolkata')
          now = datetime.now(ist)
          # Weekend check
          if now.weekday() >= 5:
              print('🛑 Weekend! Skipping scan.')
              exit(0)
          # IST Time window check (09:00 to 15:40)
          start_time = now.replace(hour=9, minute=0, second=0)
          end_time = now.replace(hour=15, minute=40, second=0)
          if not (start_time <= now <= end_time):
              print(f'🛑 Market closed. Current IST Time: {now.strftime(\"%H:%M\")}. Skipping scan.')
              exit(0)
          print(f'✅ Market is open. Current IST Time: {now.strftime(\"%H:%M\")}. Proceeding...')
          "

      - name: Run OI-VCP Stock Scanner
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python update_sheet.py

      # --- 🧹 AUTO DELETE OLD WORKFLOW RUNS STEP ---
      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        if: always() # अगर स्कैनर फ़ेल भी हो, तब भी सफाई ज़रूर होगी
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0 # 0 दिन पुराने सारे पिछले runs डिलीट हो जाएँगे
          keep_minimum_runs: 2 # सिर्फ हालिया 2 ताज़ा runs रिकॉर्ड के लिए बचेंगे
