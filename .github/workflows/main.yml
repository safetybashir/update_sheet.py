name: Run CE Stock Screener

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-ce-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy gspread google-auth pytz

      - name: Create credentials.json from Secret
        run: |
          echo "${{ secrets.GCP_CREDENTIALS_JSON }}" > credentials.json

      - name: Run CE Stock Screener Script
        env:
          SPREADSHEET_ID: ${{ secrets.SHEET_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        run: |
          python update_sheet.py

      - name: Clean up Credentials
        if: always()
        run: |
          rm -f credentials.json
