name: NSE-Auto-Sheet-Update
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12' # 3.9 se upgrade kar diya
          
      - name: Install dependencies
        # oauth2client ki jagah google-auth-oauthlib aur gspread install kar rahe hain
        run: pip install gspread google-auth pandas yfinance
      
      - name: Run script
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python update_sheet.py
