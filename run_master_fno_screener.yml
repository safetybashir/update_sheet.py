NAME:master_FNO_screener.yml

on:
  push:
    branches:
      - main
      - master
  schedule:
    # ⏱️ Cron Schedule: IST ke hisab se Mon-Fri subah 9:15 AM se shaam 3:30 PM tak har 10 minute mein auto-run hoga
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch: # Taaki aap manual button daba kar bhi jab chahein chala sakein

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client requests pytz

    - name: Execute FNO Master Python Script
      env:
        GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
      run: python update_master_fno.py

