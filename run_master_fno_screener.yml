name: Run Advanced FNO Master Screener

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'update_master_fno.py' # 🛡️ Safe Shield: Sirf is file ke change par hi chalega, purana system disturb nahi hoga
  schedule:
    # ⏱️ Adjusted Cron: IST subah 9:10 AM se shaam 3:30 PM tak, Mon-Fri har 10 minute mein automatic chalega
    - cron: '*/10 3-10 * * 1-5'
  workflow_dispatch: # Manual run button hamesha active rahega

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install gspread oauth2client requests pytz

    - name: Execute FNO Master Python Script
      env:
        GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
        SHEET_ID: ${{ secrets.SHEET_ID }}
      run: python update_master_fno.py
